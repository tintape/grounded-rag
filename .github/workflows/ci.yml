name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: NLTK data
        # Recent NLTK refuses data dirs writable by others (true for the runner's Python cache),
        # so fetch the tokenizer resources LlamaIndex needs into the runner's home directory.
        run: python -m nltk.downloader -q -d ~/nltk_data stopwords punkt_tab
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test (offline, no API keys)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80
