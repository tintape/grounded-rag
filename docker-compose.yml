services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    command: ["grounded-rag", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./eval:/app/eval
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: .
    environment:
      API_URL: http://api:8000
    command: ["streamlit", "run", "src/grounded_rag/ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    depends_on:
      - api

  # One-off job: docker compose run --rm ingest
  ingest:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    command: ["grounded-rag", "ingest"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - qdrant
    profiles: ["tools"]

volumes:
  qdrant_storage:
